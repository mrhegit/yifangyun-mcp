name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup npm for Trusted Publishing
        run: npm install --global npm@11.5.1

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run snapshot performance test
        run: npm run test:perf

      - name: Check package contents
        run: npm pack --dry-run

      - name: Generate release notes
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"

          {
            echo "## yifangyun-mcp-server v${VERSION}"
            echo ""
            echo "### Package"
            echo ""
            echo "- npm: \`yifangyun-mcp-server@${VERSION}\`"
            echo "- Global install: \`npm install -g yifangyun-mcp-server\`"
            echo "- npx: \`npx -y yifangyun-mcp-server\`"
            echo ""
            echo "### Changes"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..HEAD"
            else
              git log --pretty=format:"- %s (%h)" --max-count=20
            fi
            echo ""
            echo ""
            echo "### Verification"
            echo ""
            echo "- \`npm ci\`"
            echo "- \`npm run build\`"
            echo "- \`npm pack --dry-run\`"
          } > release-notes.md

      - name: Select npm dist-tag
        id: dist-tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "name=next" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: npm publish --tag "${{ steps.dist-tag.outputs.name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
